<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account - Marfani Steels</title>
<style>
  :root{--paper:#EDE8DE;--ink:#1B2430;--line:rgba(27,36,48,.18)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:Georgia,serif}
  main{width:min(420px,calc(100% - 40px));border-top:3px solid var(--ink);padding:28px 0}
  h1{margin:0 0 8px;font-size:32px;font-weight:600}
  p{margin:0 0 28px;color:#4A5361;font-family:Arial,sans-serif;font-size:14px}
  label{display:block;margin:16px 0 6px;font:600 12px Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em}
  input{width:100%;padding:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:16px}
  button{width:100%;margin-top:24px;padding:12px;border:0;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;cursor:pointer}
  a{color:var(--ink)}
  #error{min-height:20px;margin-top:16px;color:#A83232;font:14px Arial,sans-serif}
</style>
</head>
<body>
<main>
  <h1>Create account</h1>
  <p>Use your unique employee ID for your login.</p>
  <form id="registerForm">
    <label for="displayName">Name</label>
    <input id="displayName" name="displayName" autocomplete="name" required>
    <label for="username">Unique employee ID</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
    <button type="submit">Create account</button>
    <div id="error" role="alert"></div>
  </form>
  <p><a href="/login">Back to sign in</a></p>
</main>
<script>
  document.getElementById('registerForm').addEventListener('submit', async event => {
    event.preventDefault();
    const form = new FormData(event.currentTarget);
    const response = await fetch('/api/register', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        displayName:form.get('displayName'),
        username:form.get('username'),
        password:form.get('password')
      })
    });
    if(response.ok){ window.location.href = '/login'; return; }
    const result = await response.json().catch(() => ({}));
    document.getElementById('error').textContent = result.error || 'Could not create account';
  });
</script>
</body>
</html>
