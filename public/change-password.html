<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change password - Marfani Steels</title>
<style>
  :root{--paper:#EDE8DE;--ink:#1B2430;--line:rgba(27,36,48,.18);--rust:#A83232}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:Georgia,serif}
  main{width:min(420px,calc(100% - 40px));border-top:3px solid var(--ink);padding:28px 0}
  h1{margin:0 0 8px;font-size:32px;font-weight:600}
  p{margin:0 0 28px;color:#4A5361;font:14px Arial,sans-serif}
  label{display:block;margin:16px 0 6px;font:600 12px Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em}
  input{width:100%;padding:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:16px}
  button{width:100%;margin-top:24px;padding:12px;border:0;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;cursor:pointer}
  a{display:block;margin-top:20px;color:var(--ink);font:14px Arial,sans-serif}
  #message{min-height:20px;margin-top:16px;color:var(--rust);font:14px Arial,sans-serif}
</style>
</head>
<body>
<main>
  <h1>Change password</h1>
  <p>Choose a new password with at least 8 characters.</p>
  <form id="passwordForm">
    <label for="currentPassword">Current password</label>
    <input id="currentPassword" type="password" autocomplete="current-password" required>
    <label for="newPassword">New password</label>
    <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required>
    <label for="confirmPassword">Confirm new password</label>
    <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
    <button type="submit">Update password</button>
    <div id="message" role="alert"></div>
  </form>
  <a href="/">Back to dashboard</a>
</main>
<script>
  document.getElementById('passwordForm').addEventListener('submit', async event => {
    event.preventDefault();
    const currentPassword = document.getElementById('currentPassword').value;
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const message = document.getElementById('message');
    if(newPassword !== confirmPassword){
      message.textContent = 'New passwords do not match';
      return;
    }
    const response = await fetch('/api/me/password', {
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({currentPassword, newPassword})
    });
    const result = await response.json().catch(() => ({}));
    if(response.ok){
      message.textContent = 'Password updated successfully.';
      event.currentTarget.reset();
    }else{
      message.textContent = result.error || 'Could not update password';
    }
  });
</script>
</body>
</html>
