<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage users - Marfani Steel Group</title>
<style>
  :root{--paper:#EDE8DE;--ink:#1B2430;--line:rgba(27,36,48,.18);--rust:#A83232}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Georgia,serif}
  main{width:min(760px,calc(100% - 40px));margin:60px auto;border-top:3px solid var(--ink);padding:28px 0}
  h1{margin:0 0 8px;font-size:32px;font-weight:600}
  p{margin:0 0 28px;color:#4A5361;font:14px Arial,sans-serif}
  label{display:block;margin:16px 0 6px;font:600 12px Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em}
  input{width:100%;padding:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:16px}
  button{padding:12px 18px;margin-top:24px;border:0;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;cursor:pointer}
  a{color:var(--ink);font-family:Arial,sans-serif;font-size:14px}
  #message{min-height:20px;margin-top:16px;color:var(--rust);font:14px Arial,sans-serif}
  table{width:100%;margin-top:30px;border-collapse:collapse;font:14px Arial,sans-serif;background:#fff}
  th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  td button{margin:0;padding:7px 10px;font-size:12px}
  .danger{background:var(--rust)}
  .panel-title{margin-top:34px}
</style>
</head>
<body>
<main>
  <h1>Create user</h1>
  <p>Enter the full name and choose a login user name.</p>
  <form id="userForm">
    <label for="displayName">Full name</label>
    <input id="displayName" required>
    <label for="username">Login user ID</label>
    <input id="username" placeholder="Example: John.Doe">
    <label for="password">Temporary password</label>
    <input id="password" type="password" required minlength="8">
    <button type="submit">Create user</button>
    <div id="message" role="alert"></div>
  </form>
  <p><a href="/">Back to dashboard</a></p>
  <h2 class="panel-title">Users</h2>
  <table>
    <thead><tr><th>Name</th><th>User ID</th><th>Role</th><th>Actions</th></tr></thead>
    <tbody id="usersBody"></tbody>
  </table>
</main>
<script>
  async function loadUsers(){
    const response = await fetch('/api/admin/users');
    if(!response.ok) return;
    const users = await response.json();
    document.getElementById('usersBody').innerHTML = users.map(user => `<tr>
      <td>${user.display_name}</td><td>${user.username}</td><td>${user.role}</td>
      <td>${user.role === 'user' ? `<button data-reset="${user.username}">Reset password</button> <button class="danger" data-delete="${user.username}">Delete</button>` : 'Protected'}</td>
    </tr>`).join('');
  }

  document.getElementById('userForm').addEventListener('submit', async event => {
    event.preventDefault();
    const response = await fetch('/api/admin/users', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        displayName:document.getElementById('displayName').value,
        username:document.getElementById('username').value,
        password:document.getElementById('password').value
      })
    });
    const result = await response.json().catch(() => ({}));
    const message = document.getElementById('message');
    if(response.ok){
      message.textContent = 'User created. Login ID: ' + result.username + '. Give the ID and password securely.';
      event.currentTarget.reset();
      loadUsers();
    }else{
      message.textContent = result.error || 'Could not create user';
    }
  });

  document.getElementById('usersBody').addEventListener('click', async event => {
    const resetUser = event.target.dataset.reset;
    const deleteUser = event.target.dataset.delete;
    if(resetUser){
      const password = prompt('Enter the new password (8+ characters):');
      if(!password) return;
      const response = await fetch('/api/admin/users/' + encodeURIComponent(resetUser) + '/password', {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password})});
      document.getElementById('message').textContent = response.ok ? 'Password reset.' : 'Could not reset password.';
    }
    if(deleteUser && confirm('Delete this user?')){
      const response = await fetch('/api/admin/users/' + encodeURIComponent(deleteUser), {method:'DELETE'});
      document.getElementById('message').textContent = response.ok ? 'User deleted.' : 'Could not delete user.';
      loadUsers();
    }
  });
  loadUsers();
</script>
</body>
</html>
