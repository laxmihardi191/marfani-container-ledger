services:
  - type: web
    name: dashboard-1
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: container-cost-db
          property: connectionString
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false

databases:
  - name: container-cost-db
    plan: free
    databaseName: container_cost_ledger
    user: container_admin
